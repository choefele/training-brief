<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Small promo tile · 440×280</title>
<link rel="stylesheet" href="store.css">
<style>
  /* Headless Chrome won't make a window this narrow, so pin the size here. */
  html, body { width: 440px; height: 280px; }
  .tile { height: 100%; display: flex; flex-direction: column; justify-content: center; padding: 0 36px; box-sizing: border-box; }
  .wordmark { font-size: 46px; }
  .sub { margin-top: 18px; font-size: 21px; line-height: 1.3; color: var(--ink); }
</style>
</head>
<body>
  <div class="tile">
    <div class="mark"><img src="../icons/icon-128.png" width="72" height="72" alt=""><h1 class="wordmark">Training <span>Brief</span></h1></div>
    <p class="sub">Your Garmin Connect™ activities, ready to paste into any AI chat.</p>
  </div>
</body>
</html>
